services:
  postgres:
    image: postgres:16
    container_name: subscription-billing-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: billing_user
      POSTGRES_PASSWORD: billing_password
      POSTGRES_DB: subscription_billing

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: subscription-billing-redis
    restart: unless-stopped

    ports:
      - '6379:6379'

    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: subscription-billing-api
    restart: unless-stopped

    environment:
      PORT: 3000

      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: billing_user
      DATABASE_PASSWORD: billing_password
      DATABASE_NAME: subscription_billing

      REDIS_HOST: redis
      REDIS_PORT: 6379

    ports:
      - '3000:3000'

    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
