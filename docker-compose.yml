services:
  postgres:
    image: postgres:16
    container_name: subscription-billing-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: billing_user
      POSTGRES_PASSWORD: billing_password
      POSTGRES_DB: subscription_billing

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: subscription-billing-redis
    restart: unless-stopped

    ports:
      - '6379:6379'

    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
